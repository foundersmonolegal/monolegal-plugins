<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Así lo verá tu cliente · Mono Virtual</title>
<!--
  Vista previa, en el panel lateral, de la pantalla «Detalle del caso» de la app del cliente (prototipo de Figma
  Monos-Virtuales, nodo 41:294) con el caso que se acaba de guardar. La genera generar_revision.py --guardado
  incrustando confirmado.json y la tabla de datos personales (los nombres reales solo los ve el abogado).
  Mismo diseño que la MCP App de mostrar_caso_guardado (src/.../Mcp/Apps/CasoGuardado).
-->
<style>
  :root {
    --texto: #141413;
    --texto-suave: #5b5a55;
    --verde: #0a7f2a;
    --lima: #9ad306;
    --fondo-app: #0b0c0e;
    --tarjeta-app: #15171a;
    --letra: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f5f4ef; }
  body { font-family: var(--letra); color: var(--texto); -webkit-font-smoothing: antialiased; }

  .vista { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 12px 24px; }
  .encabezado { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .encabezado .guardado { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .encabezado .guardado .ok { width: 22px; height: 22px; border-radius: 11px; background: var(--verde); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
  .encabezado .previa { font-size: 13.5px; color: var(--texto-suave); }

  /* El móvil: marco del teléfono y pantalla de 402 × 874 como el frame de Figma */
  .movil { background: #000; border-radius: 62px; padding: 11px; box-shadow: 0 0 0 1.5px #2b2c30, 0 24px 60px rgba(0, 0, 0, 0.28); zoom: 0.75; flex: none; }
  .pantalla { position: relative; width: 402px; height: 874px; border-radius: 52px; overflow: hidden; background: var(--fondo-app); color: #fff; }
  .pantalla p { margin: 0; }
  .contenido { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 132px; scrollbar-width: none; overscroll-behavior: contain; }
  .contenido::-webkit-scrollbar { display: none; }

  .cabecera { position: relative; height: 420px; overflow: hidden; }
  .cabecera > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cabecera::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 12, 14, 0.55) 0%, rgba(11, 12, 14, 0.05) 25%, rgba(11, 12, 14, 0.25) 55%, rgba(11, 12, 14, 0.92) 85%, #0b0c0e 100%); }
  .titulo-caso { position: absolute; z-index: 1; left: 24px; right: 24px; bottom: 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .estado { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .estado img { width: 7px; height: 7px; display: block; }
  .nombre-caso { font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -0.51px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  .nombre-caso.medio { font-size: 28px; line-height: 34px; letter-spacing: -0.42px; }
  .nombre-caso.largo { font-size: 24px; line-height: 30px; letter-spacing: -0.36px; }

  .cuerpo { display: flex; flex-direction: column; gap: 28px; padding: 8px 20px 0; }
  .indicadores { display: flex; gap: 10px; }
  .indicador { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px 14px 14px; background: var(--tarjeta-app); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 18px; white-space: nowrap; }
  .indicador .etiqueta { font-size: 12px; color: rgba(255, 255, 255, 0.55); overflow: hidden; text-overflow: ellipsis; }
  .indicador .valor { font-size: 20px; font-weight: 600; letter-spacing: -0.16px; overflow: hidden; text-overflow: ellipsis; }

  .progreso { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--tarjeta-app); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .progreso .fila > * { overflow: hidden; text-overflow: ellipsis; }
  .progreso .titulo { font-size: 15px; font-weight: 600; }
  .progreso .contador { font-size: 13px; font-weight: 500; color: var(--lima); flex: none; }
  .barras { display: flex; gap: 4px; }
  .barra { flex: 1 1 0; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); }
  .barra.hecha { background: var(--lima); }
  .barra.actual { background: linear-gradient(90deg, var(--lima) 0%, var(--lima) 45%, rgba(255, 255, 255, 0.14) 46%, rgba(255, 255, 255, 0.14) 100%); }
  .progreso .ahora { font-size: 12.5px; font-weight: 500; color: rgba(255, 255, 255, 0.85); }
  .progreso .despues { font-size: 12.5px; color: rgba(255, 255, 255, 0.45); text-align: right; }

  .titulo-timeline { font-size: 20px; font-weight: 600; letter-spacing: -0.16px; }
  .total-actuaciones { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
  .timeline { display: flex; flex-direction: column; }
  .actuacion { display: flex; gap: 14px; }
  .rail { width: 14px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 3px; }
  .rail .nodo { width: 10px; height: 10px; position: relative; flex: none; }
  .rail .nodo img { position: absolute; inset: -40%; width: 180%; height: 180%; display: block; }
  .rail .linea { width: 2px; flex: 1 1 auto; min-height: 1px; border-radius: 1px; background: rgba(255, 255, 255, 0.16); }
  .actuacion.siguiente .rail { padding-top: 17px; }
  .actuacion.siguiente .rail .nodo { width: 14px; height: 14px; }
  .actuacion.siguiente .rail .nodo img { inset: 0; width: 14px; height: 14px; }
  .actuacion.siguiente .rail .linea { background: rgba(255, 255, 255, 0.1); }
  .actuacion:last-child .rail .linea { display: none; }
  .detalle { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-bottom: 26px; }
  .actuacion:last-child .detalle { padding-bottom: 0; }
  .destacado { width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; background: rgba(154, 211, 6, 0.08); border: 1px solid rgba(154, 211, 6, 0.5); border-radius: 18px; }
  .destacado .etiqueta { font-size: 11px; font-weight: 600; letter-spacing: 0.88px; color: var(--lima); }
  .destacado .titulo { font-size: 18px; line-height: 24px; font-weight: 600; }
  .destacado .texto { font-size: 14px; line-height: 20px; color: rgba(255, 255, 255, 0.78); }
  .destacado .aviso { display: flex; align-items: center; gap: 8px; padding-top: 4px; font-size: 12.5px; color: rgba(255, 255, 255, 0.65); white-space: nowrap; }
  .destacado .aviso img { width: 20px; height: 20px; display: block; }
  .detalle .fecha { font-size: 11px; font-weight: 600; letter-spacing: 0.88px; color: rgba(255, 255, 255, 0.5); white-space: nowrap; }
  .detalle .titulo { font-size: 16px; line-height: 22px; font-weight: 600; }
  .detalle .texto { font-size: 14px; line-height: 20px; color: rgba(255, 255, 255, 0.68); }
  .detalle .texto.solo { font-size: 15px; line-height: 21px; color: rgba(255, 255, 255, 0.88); }
  .detalle .chips { display: flex; gap: 8px; align-items: center; padding-top: 6px; }
  .autor { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, 0.85); white-space: nowrap; }
  .autor img, .autor .inicial { width: 20px; height: 20px; border-radius: 10px; display: block; flex: none; }
  .autor .inicial { display: flex; align-items: center; justify-content: center; background: #3a3f47; color: #fff; font-size: 10px; font-weight: 600; }

  .velo { position: absolute; top: 0; left: 0; width: 402px; height: 116px; pointer-events: none; background: linear-gradient(180deg, rgba(11, 12, 14, 0.85) 0%, rgba(11, 12, 14, 0.6) 55%, rgba(11, 12, 14, 0) 100%); }
  .navegacion { position: absolute; top: 54px; left: 0; width: 402px; height: 52px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .boton-cristal { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 0; }
  .boton-cristal img { width: 21px; height: 21px; display: block; }
  .barra-inferior { position: absolute; top: 750px; left: 0; width: 402px; height: 124px; pointer-events: none; background: linear-gradient(180deg, rgba(11, 12, 14, 0) 0%, rgba(11, 12, 14, 0.92) 35%, #0b0c0e 100%); }
  .hablar { position: absolute; top: 30px; left: 24px; width: 354px; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 12px; border-radius: 30px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.18); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); font: inherit; color: #fff; text-align: left; }
  .hablar > img { width: 44px; height: 44px; display: block; flex: none; }
  .hablar .textos { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px; white-space: nowrap; }
  .hablar .principal { font-size: 16px; line-height: 20px; font-weight: 600; }
  .hablar .secundario { font-size: 12.5px; line-height: 16px; color: rgba(255, 255, 255, 0.6); }
  .hablar .microfono { width: 44px; height: 44px; border-radius: 22px; background: var(--lima); display: flex; align-items: center; justify-content: center; flex: none; }
  .hablar .microfono img { width: 20px; height: 20px; display: block; }
  .indicador-inicio { position: absolute; left: 50%; bottom: 8px; width: 144px; height: 5px; margin-left: -72px; border-radius: 100px; background: #fff; }
  .barra-estado { position: absolute; top: 0; left: 0; width: 402px; height: 50px; padding-top: 21px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .barra-estado .hora { flex: 1 1 0; text-align: center; padding: 0 6px 0 16px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600; }
  .barra-estado .isla { width: 124px; height: 10px; flex: none; }
  .barra-estado .niveles { flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 16px 0 6px; }
  .barra-estado .niveles img { display: block; }
</style>
</head>

<script>
(function () {
  // Provisional para la demo con Jesús (20/10/2026): el caso todavía no guarda el nombre del abogado.
  var ABOGADO = "Jesús";
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  var ESPERANDO_A = {
    Juzgado: "Esperando al juzgado",
    Administracion: "Esperando a la Administración",
    Contraparte: "Esperando a la otra parte",
    Abogado: ABOGADO + " está en ello",
    Cliente: "Te toca a ti"
  };
  var MARCO = { ancho: 424, alto: 896 };

  document.querySelectorAll("img[data-img]").forEach(function (nodo) { nodo.src = IMAGENES[nodo.dataset.img] || ""; });
  document.getElementById("hablar-con").textContent = "Hablar con " + ABOGADO;

  // Que el móvil entero quepa en el panel; el contenido se desplaza dentro de la pantalla, como en el teléfono.
  function escalar() {
    var encabezado = document.querySelector(".encabezado").offsetHeight;
    var alto = (window.innerHeight || MARCO.alto) - encabezado - 54;
    var ancho = (document.documentElement.clientWidth || MARCO.ancho) - 24;
    document.getElementById("movil").style.zoom = Math.max(0.45, Math.min(1, alto / MARCO.alto, ancho / MARCO.ancho));
  }
  window.addEventListener("resize", escalar);
  escalar();

  if (!PAGINA || !PAGINA.propuesta) { document.getElementById("nombre-caso").textContent = "No hay caso guardado"; return; }
  var propuesta = PAGINA.propuesta, datos = PAGINA.datos || {};
  function mostrar(texto) {
    return String(texto || "").replace(/\[[A-Z]+(?:_\d+)?\]/g, function (clave) { return datos[clave] || clave; });
  }

  function el(etiqueta, clase, texto) {
    var nodo = document.createElement(etiqueta);
    if (clase) nodo.className = clase;
    if (texto !== undefined && texto !== null) nodo.textContent = texto;
    return nodo;
  }
  function img(nombre) { var nodo = el("img"); nodo.src = IMAGENES[nombre] || ""; nodo.alt = ""; return nodo; }
  function normalizar(texto) { return String(texto || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  // Las fechas de la revisión son días (AAAA-MM-DD): se leen en la zona del equipo para no cambiar de día.
  function fecha(valor) {
    var partes = String(valor || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    return partes ? new Date(+partes[1], +partes[2] - 1, +partes[3]) : new Date(valor);
  }
  function diaCorto(d) { return d.getDate() + " " + MESES[d.getMonth()]; }
  function diaLargo(d) { return (d.getDate() + " " + MESES[d.getMonth()] + " " + d.getFullYear()).toUpperCase(); }
  function inicioDelDia(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

  // Sin el nombre del cliente (ya sabe que el caso es suyo) y corto, para que quepa en el título de la app.
  function nombreCorto(nombre, cliente) {
    var texto = String(nombre || "").replace(/\[CLIENTE\]/g, " ").replace(/\s+/g, " ").trim();
    var palabrasCliente = {};
    normalizar(cliente).split(/\s+/).forEach(function (p) { if (p.length > 1) palabrasCliente[p] = true; });
    if (cliente) texto = texto.split(cliente).join(" ").replace(/\s+/g, " ").replace(/\s+(?:de|del|para|a)$/i, "").trim();
    for (var i = 0; i < 3 && Object.keys(palabrasCliente).length; i++) {
      var partes = texto.match(/^(.*)(?:\s+(?:de|del|para|a)\s+|\s*[-–—·,:]\s*)([^-–—·,:()]+)$/i);
      if (!partes) break;
      var palabras = normalizar(partes[2]).split(/\s+/).filter(Boolean);
      if (!palabras.length || !palabras.every(function (p) { return palabrasCliente[p]; })) break;
      texto = partes[1];
    }
    texto = texto.replace(/[\s\-–—·,:]+$/, "").trim();
    if (texto.length > 70) texto = texto.slice(0, 67).replace(/\s+\S*$/, "") + "…";
    return texto || nombre || "";
  }

  // Como en el prototipo («Querella presentada» + explicación): si empieza por una frase corta seguida de más texto,
  // esa frase es el título; si no, toda la descripción va como texto.
  function partirDescripcion(descripcion) {
    var texto = String(descripcion || "").trim();
    var corte = texto.search(/[.!?]\s/);
    if (corte > 0 && corte < 60) return { titulo: texto.slice(0, corte), texto: texto.slice(corte + 1).trim() };
    return { titulo: null, texto: texto };
  }

  function autor(nombreAutor, cliente) {
    var chip = el("span", "autor");
    if (nombreAutor === "Abogado") { chip.appendChild(img("abogado20")); chip.appendChild(document.createTextNode(ABOGADO)); return chip; }
    var etiquetas = { Cliente: "Tú", Juzgado: "Juzgado", Contraparte: "Contraparte", Administracion: "Administración" };
    var etiqueta = etiquetas[nombreAutor] || nombreAutor || "Despacho";
    var inicial = nombreAutor === "Cliente" ? (cliente || "T").trim().charAt(0).toUpperCase() : etiqueta.charAt(0);
    chip.appendChild(el("span", "inicial", inicial));
    chip.appendChild(document.createTextNode(etiqueta));
    return chip;
  }
  function rail(siguiente) {
    var r = el("div", "rail"), nodo = el("div", "nodo");
    nodo.appendChild(img(siguiente ? "nodoSiguiente" : "nodo"));
    r.appendChild(nodo);
    r.appendChild(el("div", "linea"));
    return r;
  }
  function indicador(etiqueta, valor) {
    var caja = el("div", "indicador");
    caja.appendChild(el("p", "etiqueta", etiqueta));
    caja.appendChild(el("p", "valor", valor));
    return caja;
  }

  var caso = propuesta.caso || {};
  var cliente = mostrar(caso.nombreCliente);
  var paso = propuesta.siguientePaso && propuesta.siguientePaso.descripcion ? propuesta.siguientePaso : null;
  var actuaciones = (propuesta.actuaciones || []).slice().sort(function (a, b) { return fecha(b.fecha) - fecha(a.fecha); });

  // Cabecera
  document.getElementById("texto-estado").textContent =
    paso && ESPERANDO_A[paso.responsable] ? "En curso · " + ESPERANDO_A[paso.responsable] : "En curso";
  var titulo = nombreCorto(mostrar(caso.nombre), cliente);
  var nombreCaso = document.getElementById("nombre-caso");
  nombreCaso.textContent = titulo;
  nombreCaso.className = "nombre-caso" + (titulo.length > 40 ? " largo" : titulo.length > 22 ? " medio" : "");

  // Indicadores: último paso, espera (o fecha límite) y apertura
  if (actuaciones.length) {
    var ultima = fecha(actuaciones[0].fecha), primera = fecha(actuaciones[actuaciones.length - 1].fecha);
    var dias = Math.max(0, Math.round((inicioDelDia(new Date()) - inicioDelDia(ultima)) / 86400000));
    var indicadores = document.getElementById("indicadores");
    indicadores.appendChild(indicador("Último paso", diaCorto(ultima)));
    indicadores.appendChild(paso && paso.fechaLimite
      ? indicador("Fecha límite", diaCorto(fecha(paso.fechaLimite)))
      : indicador("En espera", dias === 0 ? "Hoy" : dias === 1 ? "1 día" : dias + " días"));
    indicadores.appendChild(indicador("Caso abierto", diaCorto(primera)));
  }

  // Progreso por fases
  var fases = propuesta.fases || [];
  var actual = fases.indexOf(propuesta.faseActual);
  if (actual >= 0) {
    document.getElementById("progreso").hidden = false;
    document.getElementById("contador-fases").textContent = "Fase " + (actual + 1) + " de " + fases.length;
    var barras = document.getElementById("barras");
    fases.forEach(function (_, i) { barras.appendChild(el("div", "barra" + (i < actual ? " hecha" : i === actual ? " actual" : ""))); });
    document.getElementById("fase-ahora").textContent = "Ahora: " + propuesta.faseActual;
    document.getElementById("fase-despues").textContent = actual + 1 < fases.length ? "Después: " + fases[actual + 1] : "Última fase";
  }

  // Lo siguiente + lo que hemos hecho
  document.getElementById("total-actuaciones").textContent = actuaciones.length === 1 ? "1 actuación" : actuaciones.length + " actuaciones";
  var timeline = document.getElementById("timeline");
  if (paso) {
    var fila = el("div", "actuacion siguiente"), detalle = el("div", "detalle"), tarjeta = el("div", "destacado");
    var texto = paso.responsable === "Cliente" ? "Te toca a ti." : "Por ahora, no necesitas hacer nada. Te avisaremos en cuanto haya novedades.";
    if (paso.fechaLimite) texto += " Fecha límite: " + diaCorto(fecha(paso.fechaLimite)) + ".";
    var aviso = el("div", "aviso");
    aviso.appendChild(img("recepcion"));
    aviso.appendChild(document.createTextNode("Recepción te avisará en la app"));
    tarjeta.appendChild(el("p", "etiqueta", "LO SIGUIENTE"));
    tarjeta.appendChild(el("p", "titulo", mostrar(paso.descripcion)));
    tarjeta.appendChild(el("p", "texto", texto));
    tarjeta.appendChild(aviso);
    detalle.appendChild(tarjeta);
    fila.appendChild(rail(true));
    fila.appendChild(detalle);
    timeline.appendChild(fila);
  }
  actuaciones.forEach(function (actuacion) {
    var fila = el("div", "actuacion"), detalle = el("div", "detalle");
    var partes = partirDescripcion(mostrar(actuacion.descripcion));
    detalle.appendChild(el("p", "fecha", diaLargo(fecha(actuacion.fecha))));
    if (partes.titulo) detalle.appendChild(el("p", "titulo", partes.titulo));
    if (partes.texto) detalle.appendChild(el("p", partes.titulo ? "texto" : "texto solo", partes.texto));
    var chips = el("div", "chips");
    chips.appendChild(autor(actuacion.autor, cliente));
    detalle.appendChild(chips);
    fila.appendChild(rail(false));
    fila.appendChild(detalle);
    timeline.appendChild(fila);
  });
})();
</script>
</body>
</html>
